spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.client.autoconfigure.reactive.ReactiveOAuth2ClientAutoConfiguration
  cloud:
    gateway:
      # The whole list need to be overridden to remove CustomTokenRelayGatewayFilter
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=cookie
            - RemoveRequestHeader=x-xsrf-token

