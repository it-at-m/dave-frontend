spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: public-backend
              uri: http://localhost:${wiremock.server.port}/
              predicates:
                - Path=/public/api/dave-backend-service/**
              filters:
                - RewritePath=/public/api/dave-backend-service/(?<urlsegments>.*), /$\{urlsegments}
                - RemoveResponseHeader=WWW-Authenticate
            - id: clients-backend
              uri: http://localhost:${wiremock.server.port}/
              predicates:
                - Path=/clients/api/dave-backend-service/**
              filters:
                - RewritePath=/clients/api/dave-backend-service/(?<urlsegments>.*), /$\{urlsegments}
                - RemoveResponseHeader=WWW-Authenticate
            - id: backend
              uri: http://localhost:${wiremock.server.port}/
              predicates:
                - Path=/api/dave-backend-service/**
              filters:
                - RewritePath=/api/dave-backend-service/(?<urlsegments>.*), /$\{urlsegments}
                - RemoveResponseHeader=WWW-Authenticate

logging:
  include-application-group: false # disabled because application group is only relevant when deployed
  structured:
    format:
      console: # set to empty to disable structured logging for testing

wiremock:
  server:
    port: 0
    https-port: -1

refarch:
  security:
    public-patterns:
      - pattern: /api/dave-backend-service/public/**
        methods: [GET]
    client-patterns:
      - /api/dave-backend-service/clients/**
